[phases.setup]
nixPkgs = ["python311", "pip"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install --index-url https://download.pytorch.org/whl/cpu torch>=2.2.0 --no-cache-dir",
  "pip install -r requirements.txt --no-cache-dir"
]

[phases.build]
cmds = []

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"

